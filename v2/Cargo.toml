[package]
name = "tezbar-blurhash"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/almatkai/blurhash"

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2", version = "=0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
base64 = "0.22"
png = "0.17"
libm = "0.2"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
semver = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
qa-harness = []

[[bin]]
name = "blurhash-qa-fixture"
path = "tests/support/fixture.rs"
required-features = ["qa-harness"]
